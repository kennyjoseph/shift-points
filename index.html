<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shift Points">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Shift Points</title>
<style>
:root{
  --bg:#000; --panel:#0e0e0e; --panel2:#171717; --line:#2a2a2a; --line2:#3a3a3a;
  --fg:#fff; --dim:#9a9a9a; --dimmer:#5f5f5f; --ink:#000;
  --r:16px; --font:ui-rounded,-apple-system,"SF Pro Rounded","Helvetica Neue",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);height:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--fg)}
input[type=number]{width:64px;text-align:center}

/* header */
header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:15px}
.puck{width:26px;height:26px;border-radius:50%;background:var(--fg);box-shadow:inset 0 -5px 0 #bbb}
nav{margin-left:auto;display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px}
nav button{border:0;background:none;padding:9px 20px;border-radius:999px;font-weight:700;color:var(--dim);font-size:15px}
nav button.on{background:var(--fg);color:var(--ink)}
main{padding:20px;max-width:1400px;margin:0 auto}
section{display:none} section.on{display:block}

/* generic */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h2{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);font-weight:800}
.panel .sub{color:var(--dimmer);font-size:13px;margin:0 0 14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:16px;align-items:start}
.row{display:flex;gap:8px;align-items:center}
.list{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.item{display:flex;gap:6px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px}
.item input{background:transparent;border-color:transparent;padding:8px}
.item input:focus{border-color:var(--line2);background:#000}
.item .grow{flex:1}
.ib{border:0;background:none;color:var(--dimmer);width:32px;height:32px;border-radius:8px;font-size:15px;flex:none}
.ib:hover{background:var(--line);color:var(--fg)}
.ib.del:hover{background:#fff;color:#000}
.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:12px;padding:10px 16px;font-weight:700}
.btn.primary{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.btn:active{transform:scale(.97)}
.num{width:52px!important;text-align:center;font-weight:800}
.empty{color:var(--dimmer);font-size:14px;padding:14px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.scopehead{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer);margin:14px 0 2px;font-weight:800}
details summary{color:var(--dim);font-size:13px;cursor:pointer;margin-top:10px}
details textarea{width:100%;height:110px;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:6px 4px 4px}
.chip{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--dim);font-weight:600}
.chip.on{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.gcard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px}
kbd{font-family:inherit;font-size:11px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--dim)}

/* game */
#game{user-select:none;-webkit-user-select:none}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}
.vs{font-weight:800;font-size:20px;margin-right:auto}
.vs small{display:block;color:var(--dimmer);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{border:0;background:none;min-width:52px;height:46px;border-radius:10px;font-weight:800;color:var(--dim);font-size:16px;padding:0 12px}
.seg button.on{background:var(--fg);color:var(--ink)}
.gamegrid{display:grid;grid-template-columns:1fr 300px;gap:16px}
@media (max-width:900px){.gamegrid{grid-template-columns:1fr}}
.teamrow,.lhead{position:relative;border:1px solid var(--line2);background:linear-gradient(160deg,#222,#0b0b0b);border-radius:16px;text-align:left;transition:transform .08s}
.teamrow:active,.lhead:not(.static):active,.pb:active{transform:scale(.97)}
.teamrow{width:100%;display:flex;align-items:center;gap:16px;padding:18px 20px;margin-bottom:12px;border-color:var(--fg)}
.teamrow .lg{margin-left:auto}
.ln{font-weight:900;font-size:19px;letter-spacing:-.01em}
.lp{font-weight:900;font-size:20px;font-variant-numeric:tabular-nums}
.lp small,.pp small{font-size:10px;color:var(--dim)}
.lg{font-size:12px;color:var(--dim);font-weight:700}
.lrow{display:grid;grid-template-columns:170px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.lhead{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px 14px;min-height:76px}
.lhead.static{background:none;border-style:dashed}
.lhead .lg{margin-top:auto}
.lplayers{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;align-content:start}
.pb{position:relative;border:1px solid var(--line2);background:var(--panel2);border-radius:14px;min-height:76px;padding:12px 14px;text-align:left;display:flex;align-items:center;gap:8px;transition:transform .08s}
.pn{font-weight:800;font-size:18px;flex:1;line-height:1.15}
.pn small{display:block;font-size:12px;color:var(--dim);font-weight:700}
.pp{font-weight:900;font-size:22px;font-variant-numeric:tabular-nums}
.now{position:absolute;top:-7px;right:-5px;background:var(--fg);color:var(--ink);font-size:12px;font-weight:900;border-radius:999px;padding:2px 8px;border:2px solid #000}
@media (max-width:700px){.lrow{grid-template-columns:1fr}}
.emo{width:52px;height:46px;flex:none;border:1px solid var(--line);background:var(--panel2);border-radius:10px;font-size:24px;padding:0}
.item .emo{width:44px;height:40px;border-color:transparent;background:transparent;font-size:22px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:var(--panel2);width:40px;height:44px;font-size:20px;font-weight:800}
.stepper span{min-width:58px;text-align:center;font-weight:900}
.stepper span small{font-size:10px;color:var(--dim);margin-left:2px}
.segs{display:flex;flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px}
.segs button{flex:1;border:0;background:none;border-radius:8px;padding:9px 12px;white-space:nowrap;font-weight:800;font-size:13px;color:var(--dim)}
.segs button.on{background:var(--fg);color:var(--ink)}
#picker{position:fixed;z-index:70;display:none;background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:10px;box-shadow:0 20px 50px rgba(0,0,0,.6);width:316px}
#picker.on{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
#picker button{border:0;background:none;font-size:26px;height:42px;border-radius:8px}
#picker button:hover,#picker button:active{background:var(--line)}
.goalbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(180px,45%),1fr));gap:10px}
.gb{position:relative;border:1px solid var(--line2);background:var(--panel2);border-radius:18px;padding:16px;min-height:104px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .08s}
.gb:active{transform:scale(.95);background:var(--fg);color:var(--ink)}
.gb .ic{font-size:30px;line-height:1}
.gb .gn{font-weight:800;font-size:16px;line-height:1.2}
.gb .gp{position:absolute;top:12px;right:14px;font-weight:900;font-size:18px}
.gb .cnt{position:absolute;bottom:12px;right:12px;background:var(--fg);color:var(--ink);border-radius:999px;font-size:12px;font-weight:900;padding:2px 8px}
.gb.flash{animation:flash .45s}
@keyframes flash{0%{background:var(--fg);color:var(--ink)}100%{}}
.feed{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto}
.fe{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:10px;padding:8px 6px 8px 10px;font-size:13px}
.fe .p{font-weight:900;font-size:15px;min-width:30px}
.fe .t{flex:1;line-height:1.3}
.fe .t small{color:var(--dimmer);display:block;font-size:11px}

/* start */
.start{max-width:520px;margin:6vh auto;text-align:center}
.start h1{font-size:44px;margin:0 0 6px;letter-spacing:-.02em}
.start p{color:var(--dim)}
.start .f{display:flex;flex-direction:column;gap:10px;margin-top:24px;text-align:left}
.start input{padding:16px;font-size:18px;border-radius:14px}
.start .btn{padding:18px;font-size:18px;border-radius:14px}

/* sheet */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;display:none;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#sheet .s{background:var(--panel);border:1px solid var(--line2);border-bottom:0;border-radius:26px 26px 0 0;width:100%;max-width:900px;padding:20px 20px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out;max-height:85vh;overflow:auto;user-select:none;-webkit-user-select:none}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#sheet .sh{display:flex;align-items:center;gap:14px;margin-bottom:16px}
#sheet .sh .jn{font-size:44px;font-weight:900;line-height:1}
#sheet .sh h3{margin:0;font-size:22px}
#sheet .sh small{color:var(--dim);font-weight:600}
#sheet .sh .btn{margin-left:auto;padding:14px 26px;font-size:17px}

/* toast */
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-140px);background:var(--fg);color:var(--ink);border-radius:999px;padding:10px 10px 10px 22px;display:flex;align-items:center;gap:14px;font-weight:800;z-index:60;transition:transform .25s cubic-bezier(.2,1.4,.4,1);box-shadow:0 10px 40px rgba(255,255,255,.15)}
#toast.on{transform:translate(-50%,0)}
#toast button{border:0;background:var(--ink);color:var(--fg);border-radius:999px;padding:10px 18px;font-weight:800}

/* stats */
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:9px 6px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dimmer)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.barc{width:40%}
.barv{height:8px;background:var(--fg);border-radius:4px;min-width:2px}
.rank{color:var(--dimmer);width:28px;font-weight:800}
.bigstat{font-size:64px;font-weight:900;line-height:1}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.toolbar select{padding:12px 14px;border-radius:12px}
label.ck{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:14px}
.breakdown{color:var(--dimmer);font-size:12px}

/* games list / lineup */
.grid3.two{grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr))}
.gitem{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:14px 16px}
.gitem:active{transform:scale(.98)}
.gd{font-weight:900;font-size:15px;min-width:56px}
.gname{flex:1;font-weight:800;font-size:17px}
.gname small{display:block;color:var(--dimmer);font-size:12px;font-weight:600;margin-top:2px}
.status{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line2);border-radius:999px;padding:4px 10px;color:var(--dim);white-space:nowrap}
.status.s-live{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.status.s-final{border-style:dashed}
.gfields{display:flex;gap:8px;flex:1;min-width:240px}
.gfields input:first-child{flex:1}
.golive{height:56px;padding:0 26px;font-size:17px}
.chips.big .chip{padding:10px 16px;font-size:15px}
/* potg */
.prow{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 16px}
.prow.win{border-color:var(--fg)}
.prow.out{opacity:.45}
/* goal-first live view */
.gstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.gpick{position:relative;border:2px solid var(--line2);background:var(--panel2);border-radius:18px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:110px}
.gpick .ic{font-size:28px;line-height:1}
.gpick .gn{font-weight:900;font-size:17px;line-height:1.15;padding-right:34px}
.gpick .gs{font-size:12px;color:var(--dim);font-weight:700;margin-top:auto}
.gpick .gc{position:absolute;top:12px;right:14px;font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.gpick:active{background:var(--fg);color:var(--ink)}
.gpick .gtap{font-size:12px;font-weight:800;color:var(--dim)}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-content:start}
.gcol{display:flex;flex-direction:column;gap:8px}
.gcol .gpick{min-height:150px;padding:18px}
.gcol .gpick .ic{font-size:36px}
.gcol .gpick .gn{font-size:20px}
.gcol .gpick .gc{font-size:34px}
.gtally{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px}
.gtally span{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;color:var(--dim)}
.gtally span b{color:var(--fg)}
.gtally .none{border-style:dashed}
#sheet .pickm{display:flex;flex-direction:column;gap:6px;padding-bottom:0;max-width:1000px}
.pb.pick{position:relative}
.pb.pick .pc{font-size:13px;font-weight:800;color:var(--dim)}
.pb.pick .chk{position:absolute;top:-7px;right:-6px;width:24px;height:24px;border-radius:50%;background:var(--fg);color:var(--ink);font-size:14px;font-weight:900;display:none;align-items:center;justify-content:center;border:2px solid #000}
.pb.pick.on{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.pb.pick.on .pn small,.pb.pick.on .pc{color:#444}
.pb.pick.on .chk{display:flex}
button.tlabel{border:0;background:none;text-align:left;color:var(--fg);font-weight:900;font-size:15px;padding:10px 0 0;cursor:pointer}
.tlabel small{display:block;color:var(--dimmer);font-size:11px;font-weight:700;margin-top:2px}
.pickfoot{position:sticky;bottom:0;display:flex;gap:10px;padding:14px 0 calc(16px + env(safe-area-inset-bottom));margin-top:8px;background:linear-gradient(transparent,var(--panel) 30%)}
.pickfoot .btn{padding:16px 22px;font-size:17px}
.pickfoot .primary{flex:1}
.pickfoot .primary:disabled{opacity:.35}
.thead{color:var(--dim);font-size:14px;margin-bottom:10px}
.thead b{color:var(--fg)}
.trow{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.tlabel{font-weight:800;color:var(--dim);font-size:14px;padding-top:10px}
.pb.has{border-color:var(--fg);background:#262626}
.pb.flash{animation:flash .45s}
.pb .pp{font-size:26px}
.lplayers.wide{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.pb.tall{min-height:96px}
.pb .pn small{margin-top:4px}
.pb.team{width:100%;min-height:150px;padding:24px}
.pb.team .pn{font-size:28px}
.pb.team .pp{font-size:56px}
.fe .p{min-width:0}
/* stats matrix */
.mwrap{overflow-x:auto;margin:0 -6px}
table.matrix{border-collapse:separate;border-spacing:3px;width:auto;min-width:100%}
.matrix td,.matrix th{border:0;padding:8px 10px}
.matrix th.c{font-size:12px;letter-spacing:0;text-transform:none;color:var(--fg);font-weight:800;text-align:center;vertical-align:bottom;min-width:76px;max-width:130px}
.matrix th small{display:block;color:var(--dimmer);font-weight:600;font-size:11px;margin-top:2px}
.matrix td.c{text-align:center;font-weight:800;font-variant-numeric:tabular-nums;border-radius:8px}
.matrix td.na{background:repeating-linear-gradient(45deg,transparent 0 4px,#151515 4px 8px)}
.matrix .rn{position:sticky;left:0;background:var(--panel);font-weight:800;white-space:nowrap;z-index:1;padding-left:6px}
.matrix .tot{font-weight:900;font-size:16px;background:var(--panel2)}
table.ptable{margin:8px 0 22px;font-size:14px}
.ptable td,.ptable th{padding:7px 4px;border-bottom:1px solid var(--line)}
.ptable th.c,.ptable td.c{text-align:center;width:40px;font-variant-numeric:tabular-nums;font-weight:800}
.ptable th.cur{color:var(--fg)}
.ptable td.cur{background:var(--panel2)}
.ptable .gname2{font-weight:700;font-size:13px;line-height:1.2}
.ptable .tot{font-weight:900}
.ptable tr.ptot td{border-bottom:0;font-weight:900}
.trtabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.trtabs button{flex:none;border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:12px 18px;font-weight:800;color:var(--dim);font-size:15px}
.trtabs button.on{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.pinfo{flex:1;min-width:0}
.pinfo b{font-size:17px}
.pinfo small{display:block;color:var(--dimmer);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcount{font-size:28px;font-weight:900;min-width:36px;text-align:center;font-variant-numeric:tabular-nums}
.prow .btn{min-width:104px}
/* sync */
#syncbtn{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:none;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--dim)}
#syncbtn i{width:9px;height:9px;border-radius:50%;background:var(--dimmer)}
#syncbtn.ok i{background:var(--fg)}
#syncbtn.busy i{background:var(--fg);animation:pulse 1s infinite}
#syncbtn.err i{background:none;border:2px solid var(--fg);width:10px;height:10px}
#syncbtn.err{color:var(--fg)}
@keyframes pulse{50%{opacity:.25}}
header nav{margin-left:0}
.syncf{display:flex;flex-direction:column;gap:12px}
.syncf label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--dim);font-weight:700}
.syncf input{font-size:16px}
.joinbox{margin-bottom:16px;border-color:var(--fg)}

/* ---------- phone ---------- */
@media (max-width:600px){
  header{padding:10px 12px;gap:8px}
  .brand span{display:none}
  .brand img{height:32px!important}
  nav button{padding:8px 14px;font-size:14px}
  main{padding:12px}
  .panel{padding:14px}
  .bar{gap:8px;margin-bottom:10px}
  .vs{width:100%;font-size:18px}
  .seg{flex:1}
  .seg button{flex:1;min-width:0;height:44px;padding:0}
  .bar .btn{height:52px!important;padding:0 14px}
  .teamrow{padding:14px 16px;gap:10px}
  .lrow{grid-template-columns:1fr;gap:6px;padding:8px 0}
  .lhead{flex-direction:row;align-items:center;min-height:0;padding:10px 14px;gap:10px}
  .lhead .lg{margin:0 0 0 auto}
  .lplayers{grid-template-columns:repeat(3,1fr);gap:6px}
  .gstrip{grid-template-columns:repeat(2,1fr);gap:8px}
  .gpick{min-height:92px;padding:12px}
  .gpick .gn{font-size:15px}
  .gcards{grid-template-columns:1fr 1fr;gap:10px}
  .gcol .gpick{min-height:120px;padding:12px}
  .gcol .gpick .ic{font-size:28px}
  .gcol .gpick .gn{font-size:16px}
  .gcol .gpick .gc{font-size:26px}
  .trow button.tlabel{padding:4px 0}
  .trow{grid-template-columns:1fr;gap:4px}
  .tlabel{padding:0}
  .lplayers.wide{grid-template-columns:1fr}
  .toolbar .segs{flex:1 1 100%}
  .pb{min-height:62px;padding:8px 10px;flex-direction:column;align-items:flex-start;gap:2px}
  .pn{font-size:15px;flex:none;overflow-wrap:anywhere}
  .pp{font-size:18px}
  .ln{font-size:17px}
  .goalbtns{gap:8px}
  .gb{min-height:92px;padding:12px;border-radius:14px}
  .gb .ic{font-size:24px}
  .gb .gn{font-size:14px;padding-right:22px}
  .gb .gp{font-size:15px;top:10px;right:10px}
  .gb .cnt{font-size:10px;padding:1px 6px;bottom:8px;right:8px}
  #sheet .s{padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
  #sheet .sh .jn{font-size:32px}
  #sheet .sh h3{font-size:19px}
  #sheet .sh .btn{padding:12px 20px}
  #toast{max-width:calc(100% - 24px);font-size:14px;padding:8px 8px 8px 16px}
  #toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .toolbar > *{flex:1 1 auto}
  .toolbar span[style]{display:none}
  .barc{display:none}
  .start h1{font-size:34px}
  .item{gap:2px}
  .brand img{display:none}
  #syncbtn{padding:8px}
  #syncbtn span{display:none}
  nav button{padding:8px 10px;font-size:13px}
  .gfields{min-width:0;flex:1 1 100%;order:5}
  .gfields input[type=date]{flex:none;width:150px}
  .golive{width:100%;order:6}
  .prow{padding:8px 8px 8px 12px;gap:6px}
  .prow .btn{min-width:0;padding:10px 12px}
  .ib{width:28px}
}
</style>
</head>
<body>
<header>
  <div class="brand"><img src="logo.png" alt="Clarence" style="height:38px;border-radius:6px"><span>Shift Points</span></div>
  <button id="syncbtn" class="off" data-act="syncsettings"><i></i><span>Sync off</span></button>
  <nav>
    <button data-act="view" data-v="game">Game</button>
    <button data-act="view" data-v="roster">Roster</button>
    <button data-act="view" data-v="goals">Goals</button>
    <button data-act="view" data-v="stats">Stats</button>
    <button data-act="view" data-v="potg">Trackers</button>
  </nav>
</header>
<main>
  <section id="game"></section>
  <section id="roster"></section>
  <section id="goals"></section>
  <section id="potg"></section>
  <section id="stats"></section>
</main>
<div id="sheet"></div>
<div id="picker"></div>
<div id="toast"><span id="toastMsg"></span><button data-act="undo">Undo</button></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script src="ops.js"></script>
<script>
const KEY = 'shiftpoints.v1';
const APP_VERSION = '10';
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const SCOPES = [['individual','Individual'],['group','Line / Group'],['team','Whole Team']];
const PERIODS = ['1','2','3','OT'];
const VIEWS = ['roster','goals','game','stats','potg'];
const EMOJI = ['⭐','🔥','💪','🎯','🏒','🥅','🚀','🛡️','🔙','⏱️','🔄','📣','🏆','👏','🧠','👀','🤝','⚡','💨','🧱','🙌','🎉','🐎','❤️','✅','🔺','🧊','🚨','💯','🥇','👊','🌟','😤','🫡','🏃'];

/* ---------------- DATA ---------------- */
function seed(){
  const g = (name, scope, points, icon) => ({id:uid(), name, scope, points, icon});
  const players = [], groups = [];
  [['Red Line','Gio Dominic Zach'],['Blue Line','Luca Ben Preston'],['White Line','Jaxon Rico Andrew'],
   ['D Pair 1','Owen S|Lincoln'],['D Pair 2','Parker Noah'],['D Pair 3','Charlotte OJ'],['Goalie','Olivia']]
  .forEach(([gname, names]) => {
    const members = (names.includes('|') ? names.split('|') : names.split(' ')).map(name => {
      const p = {id:uid(), number:'', name}; players.push(p); return p.id;
    });
    groups.push({id:uid(), name:gname, members});
  });
  return Object.assign(blankState(), { players, groups, goals: [
    g('Backchecked hard','individual',1,'🔙'), g('Won a puck battle','individual',1,'💪'),
    g('Tape-to-tape pass','individual',1,'🎯'), g('Quick line change','individual',1,'⏱️'),
    g('Clean breakout','group',2,'🚀'), g('3 passes in O-zone','group',2,'🔺'), g('Everyone back on D','group',2,'🛡️'),
    g('Great bench energy','team',3,'📣'), g('Won the period','team',3,'🏆'),
  ]});
}
const jget = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch(e){ return d; } };
function load(){
  const d = jget(KEY, null);
  if (!d || !d.players) return seed();
  if (!d.renamedLines){ d.groups.forEach(g => { if (['Red','Blue','White'].includes(g.name)) g.name += ' Line'; }); d.renamedLines = true; }
  d.potg = d.potg || []; d.dead = d.dead || {}; d.trackers = d.trackers || [];
  return d;
}
let S = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ alert('Could not save: ' + e.message); } }
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

/* ---------------- SYNC STATE ---------------- */
const SYNC_KEY = 'shiftpoints.sync', OUT_KEY = 'shiftpoints.outbox';
let SY = Object.assign({ url:'', code:'', coach:'', since:0, device: uid() + uid() }, jget(SYNC_KEY, {}));
let OUT = jget(OUT_KEY, []);
let SYS = { busy:false, err:'' }, syncTimer = null;
function saveSync(){ try { localStorage.setItem(SYNC_KEY, JSON.stringify(SY)); localStorage.setItem(OUT_KEY, JSON.stringify(OUT)); } catch(e){} }
saveSync();

// Every change goes through here: apply locally right away, queue it for the Sheet.
function commit(op){
  op.ts = Date.now(); applyOp(S, op); save();
  if (SY.url){ OUT.push(op); saveSync(); scheduleSync(); }
  updateSyncDot();
}

let UI = { view: localStorage.getItem('shiftpoints.view') || 'game', gameId: localStorage.getItem('shiftpoints.game') || null,
           mode: 'prep', stGame: null, stGoal: 'all', stLevel: 'player', stCols: 'goals', share: false, sheet: null, newScope: 'individual', potgGame: null, tracker: 'potg', trSort: 'roster' };
if (!VIEWS.includes(UI.view)) UI.view = 'game';
let lastUndo = null, toastTimer = null, pendingRender = false;

/* ---------------- HELPERS ---------------- */
const player = id => S.players.find(p => p.id === id);
const pname = p => p ? (p.number ? '#' + p.number + ' ' : '') + p.name : '?';
const game = () => S.games.find(g => g.id === UI.gameId);
const gPresent = g => g.present || S.players.map(p => p.id);
const gLines = g => g.lines || S.groups;
const gGoalIds = g => g.goalIds || S.goals.map(x => x.id);
const gMeta = (g, ch) => Object.assign({ id:g.id, name:g.name, date:g.date, period:g.period || '1', ended:!!g.ended,
  present:gPresent(g).slice(), lines:clone(gLines(g)), goalIds:gGoalIds(g).slice() }, ch || {});
const setGame = (g, ch) => commit({ t:'game', v:gMeta(g, ch) });
const gameStatus = g => g.ended ? 'Final' : g.events.length ? 'Live' : 'Upcoming';
const fmtDate = d => { if (!d) return ''; const x = new Date(d + 'T12:00'); return isNaN(x) ? d : x.toLocaleDateString([], {month:'short', day:'numeric'}); };
function openGame(id, mode){ UI.gameId = id; UI.mode = mode || 'prep'; localStorage.setItem('shiftpoints.game', id || ''); }

/* ---------------- VIEW SWITCH ---------------- */
function setView(v){
  UI.view = v; localStorage.setItem('shiftpoints.view', v);
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  document.querySelectorAll('main section').forEach(s => s.classList.toggle('on', s.id === v));
  render(); window.scrollTo(0, 0);
}
function render(){
  pendingRender = false;
  ({roster:renderRoster, goals:renderGoals, game:renderGame, stats:renderStats, potg:renderTrackers})[UI.view]();
  if (UI.sheet) renderSheet();
}
function refresh(){ // after remote changes arrive: don't yank the page out from under someone typing
  const a = document.activeElement;
  if (a && a.matches('input,textarea,select') && a.type !== 'checkbox') pendingRender = true; else render();
}

/* ---------------- ROSTER ---------------- */
function moveBtns(act, id, extra){
  return `<button class="ib" data-act="${act}" data-id="${id}" data-dir="-1" ${extra||''} title="Move up">▲</button>
          <button class="ib" data-act="${act}" data-id="${id}" data-dir="1" ${extra||''} title="Move down">▼</button>`;
}
const delBtn = (act, id, extra) => `<button class="ib del" data-act="${act}" data-id="${id}" ${extra||''} title="Delete">✕</button>`;
function lineCards(lines, players, mode){ // mode 'def' = default lines (Roster tab), 'game' = this game's lines
  return lines.map(l => `
    <div class="gcard">
      <div class="row">
        <input class="grow" style="background:transparent;border-color:transparent;font-weight:800" data-${mode === 'def' ? `edit="groups:${l.id}:name"` : `gline="${l.id}"`} value="${esc(l.name)}">
        ${moveBtns(mode === 'def' ? 'move' : 'glmove', l.id, mode === 'def' ? 'data-coll="groups"' : '')}
        ${delBtn(mode === 'def' ? 'del' : 'gldel', l.id, mode === 'def' ? 'data-coll="groups"' : '')}
      </div>
      <div class="chips">${players.map(p => `<button class="chip ${l.members.includes(p.id) ? 'on' : ''}" data-act="${mode === 'def' ? 'member' : 'glmember'}" data-g="${l.id}" data-p="${p.id}">${esc(pname(p))}</button>`).join('') || '<span class="breakdown">No players</span>'}</div>
    </div>`).join('') || '<div class="empty">No lines yet</div>';
}
function renderRoster(){
  const players = S.players.map(p => `
    <div class="item">
      <input class="num" data-edit="players:${p.id}:number" value="${esc(p.number)}" placeholder="#" inputmode="numeric">
      <input class="grow" data-edit="players:${p.id}:name" value="${esc(p.name)}">
      ${moveBtns('move', p.id, 'data-coll="players"')}${delBtn('del', p.id, 'data-coll="players"')}
    </div>`).join('') || '<div class="empty">No players yet</div>';
  $('#roster').innerHTML = `
  <div class="grid3 two">
    <div class="panel">
      <h2>Roster</h2><p class="sub">Everyone on the team. Type a number and name, press <kbd>Enter</kbd>, e.g. “12 Ava”.</p>
      <form data-form="player" class="row"><input class="grow" name="n" placeholder="12 Ava Smith" autocomplete="off"><button class="btn primary">Add</button></form>
      <details><summary>Paste a whole list</summary>
        <textarea id="bulk" placeholder="One player per line&#10;12 Ava Smith&#10;7 Leo Park"></textarea>
        <button class="btn" data-act="bulk" style="margin-top:8px">Add all</button>
      </details>
      <div class="list">${players}</div>
    </div>
    <div class="panel">
      <h2>Default Lines</h2><p class="sub">The starting point for a new game. Change lines for a specific game in the Game tab.</p>
      <form data-form="group" class="row"><input class="grow" name="n" placeholder="Line 1, D-pair 2, PP unit…" autocomplete="off"><button class="btn primary">Add</button></form>
      <div class="list">${lineCards(S.groups, S.players, 'def')}</div>
    </div>
  </div>`;
}

/* ---------------- GOALS ---------------- */
function renderGoals(){
  const goals = SCOPES.map(([sc, label]) => {
    const list = S.goals.filter(g => g.scope === sc);
    return `<div class="scopehead">${label}</div>` + (list.map(g => `
      <div class="item" style="flex-wrap:wrap">
        <button class="emo" data-act="pick" data-target="${g.id}">${esc(g.icon || '⭐')}</button>
        <input style="flex:1 1 70%;font-weight:700" data-edit="goals:${g.id}:name" value="${esc(g.name)}">
        <span style="width:44px"></span>
        <input type="number" class="num" data-edit="goals:${g.id}:points" value="${g.points}" title="Points each time it's earned"><span class="breakdown">pts each</span>
        <select data-edit="goals:${g.id}:scope" style="flex:1;padding:6px 8px;font-size:13px" title="Who earns it">${SCOPES.map(([v,l]) => `<option value="${v}" ${v===sc?'selected':''}>${l}</option>`).join('')}</select>
        ${moveBtns('move', g.id, 'data-coll="goals"')}${delBtn('del', g.id, 'data-coll="goals"')}
      </div>`).join('') || '<div class="empty" style="padding:8px">None</div>');
  }).join('');
  $('#goals').innerHTML = `
  <div class="grid3 two">
    <div class="panel">
      <h2>New Goal</h2><p class="sub">Every goal the team uses. Pick 3–5 for each game in the Game tab. Points = how much one tally counts toward the overall score; changing it recalculates every game.</p>
      <form data-form="goal" style="display:flex;flex-direction:column;gap:10px">
        <div class="row">
          <button type="button" class="emo" data-act="pick" data-target="new" id="newIcon">⭐</button>
          <input type="hidden" name="i" value="⭐">
          <input class="grow" name="n" placeholder="e.g. “Stopped at the net”" autocomplete="off">
        </div>
        <div class="segs">${SCOPES.map(([v,l]) => `<button type="button" class="${v===UI.newScope?'on':''}" data-act="newscope" data-s="${v}">${l}</button>`).join('')}</div>
        <input type="hidden" name="s" value="${UI.newScope}">
        <div class="row">
          <div class="stepper"><button type="button" data-act="newpts" data-d="-1">−</button><span><b id="newPts">1</b><small>PTS</small></span><button type="button" data-act="newpts" data-d="1">+</button></div>
          <input type="hidden" name="p" value="1">
          <button class="btn primary" style="flex:1">Add Goal</button>
        </div>
      </form>
    </div>
    <div class="panel"><h2>All Goals</h2><div class="list" style="margin-top:0">${goals}</div></div>
  </div>`;
}

/* ---------------- GAME: LIST ---------------- */
function evPoints(evts, type, id){ return evts.filter(e => e.targetType === type && (type === 'team' || e.targetId === id)).reduce((a,e) => a + e.points, 0); }
function renderGame(){
  const g = game();
  if (!g) return renderGameList();
  if (UI.mode === 'live' && !g.ended) return renderLive(g);
  renderPrep(g);
}
function renderGameList(){
  const games = [...S.games].sort((a,b) => (b.date || '').localeCompare(a.date || ''));
  $('#game').innerHTML = joinBox() + `
  <div class="grid3 two">
    <div class="panel">
      <img src="logo.png" alt="Clarence" style="width:160px;border-radius:10px;margin-bottom:12px">
      <h2>New Game</h2><p class="sub">Starts with the lines and goals from your last game. You can change them before puck drop.</p>
      <form data-form="newgame" style="display:flex;flex-direction:column;gap:10px">
        <input name="o" placeholder="Opponent (e.g. vs Sabres)" autocomplete="off" style="padding:14px;font-size:17px">
        <input name="d" type="date" value="${today()}" style="padding:14px;font-size:17px">
        <button class="btn primary" style="padding:16px;font-size:17px">Create Game</button>
      </form>
    </div>
    <div class="panel">
      <h2>Games</h2><p class="sub">${games.length} game${games.length === 1 ? '' : 's'}</p>
      <div class="list">${games.map(x => `
        <button class="gitem" data-act="opengame" data-id="${x.id}">
          <span class="gd">${esc(fmtDate(x.date))}</span>
          <span class="gname">${esc(x.name)}<small>${gPresent(x).length} players · ${x.events.reduce((a,e)=>a+e.points,0)} pts</small></span>
          <span class="status s-${gameStatus(x).toLowerCase()}">${gameStatus(x)}</span>
        </button>`).join('') || '<div class="empty">No games yet</div>'}</div>
    </div>
  </div>
  <p class="breakdown" style="text-align:center;margin-top:24px">Version ${APP_VERSION}</p>`;
}

/* ---------------- GAME: LINEUP (per game) ---------------- */
function renderPrep(g){
  const present = new Set(gPresent(g));
  const here = S.players.filter(p => present.has(p.id));
  const lines = gLines(g).map(l => Object.assign({}, l, { members: l.members.filter(m => present.has(m)) }));
  const ids = new Set(gGoalIds(g));
  const goalChips = SCOPES.map(([sc, label]) => {
    const list = S.goals.filter(x => x.scope === sc);
    return list.length ? `<div class="scopehead">${label}</div><div class="chips" style="padding:4px 0">${list.map(x =>
      `<button class="chip ${ids.has(x.id) ? 'on' : ''}" data-act="ggoal" data-id="${x.id}">${esc(x.icon || '⭐')} ${esc(x.name)} · ${x.points}</button>`).join('')}</div>` : '';
  }).join('');
  $('#game').innerHTML = `
    <div class="bar">
      <button class="btn" data-act="games">‹ Games</button>
      <div class="gfields">
        <input data-gfield="name" value="${esc(g.name)}" style="font-weight:800;font-size:18px">
        <input type="date" data-gfield="date" value="${esc(g.date)}">
      </div>
      <span class="status s-${gameStatus(g).toLowerCase()}">${gameStatus(g)}</span>
      <button class="btn primary golive" data-act="golive">${g.ended ? 'Reopen Game' : 'Go Live ▸'}</button>
    </div>
    <div class="grid3">
      <div class="panel">
        <h2>Who's Here</h2><p class="sub">${here.length} of ${S.players.length} players. Tap to mark someone out.</p>
        <div class="row" style="margin-bottom:8px"><button class="btn" data-act="allhere" data-v="1">Everyone</button><button class="btn" data-act="allhere" data-v="0">Nobody</button></div>
        <div class="chips big">${S.players.map(p => `<button class="chip ${present.has(p.id) ? 'on' : ''}" data-act="here" data-p="${p.id}">${esc(pname(p))}</button>`).join('')}</div>
      </div>
      <div class="panel">
        <h2>Lines This Game</h2><p class="sub">Only players who are here are shown.</p>
        <form data-form="gline" class="row"><input class="grow" name="n" placeholder="Add a line…" autocomplete="off"><button class="btn primary">Add</button></form>
        <button class="btn" data-act="resetlines" style="margin-top:8px;width:100%">Reset to default lines</button>
        <div class="list">${lineCards(lines, here, 'game')}</div>
      </div>
      <div class="panel">
        <h2>Goals This Game</h2><p class="sub">${ids.size} in play (3–5 works best). Add new goals in the Goals tab.</p>
        ${goalChips || '<div class="empty">No goals yet</div>'}
      </div>
    </div>
    <div style="margin-top:24px;text-align:center"><button class="btn" data-act="delgame" data-id="${g.id}" style="color:var(--dim)">Delete this game</button></div>`;
}

/* ---------------- GAME: LIVE (tap a goal -> pick who earned it -> Apply) ---------------- */
const SCOPE_SHORT = { individual: 'Player', group: 'Line', team: 'Team' };
const weight = e => { const x = S.goals.find(g => g.id === e.goalId); return x ? (Number(x.points) || 0) : (e.points || 0); };
const tallyOf = (evts, goalId) => Object.values(evts.filter(e => e.goalId === goalId).reduce((m, e) => {
  const k = e.targetType + e.targetId; (m[k] = m[k] || { name: e.targetName, n: 0 }).n++; return m; }, {})).sort((a, b) => b.n - a.n);
function renderLive(g){
  const evts = g.events, ids = new Set(gGoalIds(g));
  const goals = S.goals.filter(x => ids.has(x.id));
  const cards = goals.map(x => {
    const n = evts.filter(e => e.goalId === x.id).length, t = tallyOf(evts, x.id);
    return `<div class="gcol">
      <button class="gpick" data-act="lgoal" data-id="${x.id}">
        <span class="ic">${esc(x.icon || '⭐')}</span><span class="gn">${esc(x.name)}</span>
        <span class="gs">${SCOPE_SHORT[x.scope]} · ${x.points} pt${x.points == 1 ? '' : 's'}</span><span class="gc">${n}</span>
        <span class="gtap">Tap to give ›</span></button>
      <div class="gtally">${t.map(r => `<span><b>${esc(r.name)}</b>${r.n > 1 ? ' ×' + r.n : ''}</span>`).join('') || '<span class="none">Nobody yet</span>'}</div>
    </div>`;
  }).join('');
  $('#game').innerHTML = `
    <div class="bar">
      <button class="btn" data-act="prep">‹ Lineup</button>
      <div class="vs"><small>${esc(fmtDate(g.date))}</small>${esc(g.name)}</div>
      <div class="seg">${PERIODS.map(p => `<button class="${g.period===p?'on':''}" data-act="period" data-p="${p}">${p==='OT'?'OT':'P'+p}</button>`).join('')}</div>
      <button class="btn" data-act="endgame" style="height:56px">End Game</button>
    </div>
    <div class="gamegrid">
      <div class="gcards">${cards || '<div class="empty">No goals for this game. Pick some under ‹ Lineup.</div>'}</div>
      <div class="panel">
        ${goals.length ? periodTable(g, goals) : ''}
        <h2>Recent</h2>
        <p class="sub">${evts.length} tallies · ${evts.reduce((a, e) => a + weight(e), 0)} points</p>
        <div class="feed">${[...evts].sort((a,b) => b.ts - a.ts).slice(0, 25).map(e => `
          <div class="fe"><span class="t">${esc(e.targetName)} — ${esc(e.goalName)}<small>${e.period==='OT'?'OT':'P'+e.period} · ${new Date(e.ts).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}${e.coach ? ' · ' + esc(e.coach) : ''}</small></span>
            <button class="ib del" data-act="delev" data-id="${e.id}">✕</button></div>`).join('') || '<div class="empty">Tap a goal to give it out</div>'}</div>
      </div>
    </div>`;
}
function periodTable(g, goals){
  const evts = g.events, pers = PERIODS.filter(p => p !== 'OT' || evts.some(e => e.period === 'OT') || g.period === 'OT');
  const n = (gid, p) => evts.filter(e => e.goalId === gid && e.period === p).length;
  const pts = p => evts.filter(e => e.period === p).reduce((a, e) => a + weight(e), 0);
  const c = (v, cur) => `<td class="c${cur ? ' cur' : ''}">${v || '·'}</td>`;

function statGames(){ return UI.stGame === 'all' ? S.games : S.games.filter(g => g.id === UI.stGame); }
function renderStats(){
  if (UI.stGame === null || (UI.stGame !== 'all' && !S.games.find(g => g.id === UI.stGame))){
    const recent = [...S.games].sort((a,b) => (b.date||'').localeCompare(a.date||''))[0];
    UI.stGame = (game() || recent || {}).id || 'all';
  }
  if (UI.stGoal !== 'all' && !S.goals.find(g => g.id === UI.stGoal)) UI.stGoal = 'all';
  const L = UI.stLevel, byGame = UI.stCols === 'games', byPeriod = UI.stCols === 'periods';
  const games = [...S.games].sort((a,b) => (a.date||'').localeCompare(b.date||''));
  let rows;
  if (L === 'player') rows = S.players.map(p => ({ name: pname(p), here: g => gPresent(g).includes(p.id),
    match: e => (e.targetType === 'player' && e.targetId === p.id) || (UI.share && e.targetType !== 'player' && (e.members || []).includes(p.id)) }));
  else if (L === 'group'){
    const names = [...new Set(S.groups.map(x => x.name).concat(S.games.flatMap(g => g.events.filter(e => e.targetType === 'group').map(e => e.targetName))))];
    rows = names.map(n => ({ name: n, here: g => gLines(g).some(l => l.name === n), match: e => e.targetType === 'group' && e.targetName === n }));
  } else rows = [{ name: 'Team goals', here: () => true, match: e => e.targetType === 'team' }, { name: 'Everything combined', here: () => true, match: () => true }];

  const scope = { player: 'individual', group: 'group', team: 'team' }[L];
  let cols, measure;
  if (byPeriod){
    const goal = S.goals.find(x => x.id === UI.stGoal), gs = statGames();
    const ev = gs.flatMap(g => g.events).filter(e => !goal || e.goalId === goal.id);
    const pers = PERIODS.filter(p => p !== 'OT' || ev.some(e => e.period === 'OT'));
    cols = pers.map(p => ({ head: p === 'OT' ? 'OT' : 'Period ' + p, sub: '' }));
    rows.forEach(r => { r.cells = pers.map(p => { const l = ev.filter(e => e.period === p && r.match(e)); return goal ? l.length : l.reduce((a,e) => a + weight(e), 0); });
      r.total = r.cells.reduce((a,v) => a + v, 0); });
    measure = (goal ? `Cells are times “${goal.name}” was earned in each period` : 'Cells are points (tallies × each goal\'s points) in each period') + (UI.stGame === 'all' ? ', added up over all games.' : ' of this game.');
  } else if (!byGame){
    const ev = statGames().flatMap(g => g.events);
    const gl = S.goals.filter(x => x.scope === scope || L === 'team' || (L === 'player' && UI.share) || ev.some(e => e.goalId === x.id && rows.some(r => r.match(e))));
    cols = gl.map(x => ({ head: `${x.icon || ''} ${x.name}`, sub: `${x.points} pt${x.points == 1 ? '' : 's'}`, val: r => ev.filter(e => e.goalId === x.id && r.match(e)).length }));
    rows.forEach(r => { r.total = ev.filter(r.match).reduce((a,e) => a + weight(e), 0); r.cells = cols.map(c => c.val(r)); });
    measure = 'Cells are tallies. Total = tallies × each goal\'s points.';
  } else {
    const goal = S.goals.find(x => x.id === UI.stGoal);
    cols = games.map(g => ({ head: fmtDate(g.date), sub: g.name, g }));
    rows.forEach(r => {
      r.cells = cols.map(c => { if (!r.here(c.g)) return null;
        const l = c.g.events.filter(e => r.match(e) && (!goal || e.goalId === goal.id));
        return goal ? l.length : l.reduce((a,e) => a + weight(e), 0); });
      const played = r.cells.filter(v => v !== null);
      r.total = played.reduce((a,v) => a + v, 0); r.avg = played.length ? r.total / played.length : 0;
    });
    measure = goal ? `Cells are times “${goal.name}” was earned in each game. Blank = not at that game.` : 'Cells are points (tallies × each goal\'s points) in each game. Blank = not at that game.';
  }
  rows.sort((a,b) => b.total - a.total);
  const max = Math.max(1, ...rows.flatMap(r => r.cells.filter(v => v !== null)));
  const cell = v => v === null ? '<td class="c na"></td>' : `<td class="c" style="background:rgba(255,255,255,${(v / max * .38).toFixed(3)})">${v || '·'}</td>`;
  const seg = (act, cur, opts) => `<div class="segs" style="flex:none">${opts.map(([v,l]) => `<button class="${cur === v ? 'on' : ''}" data-act="${act}" data-v="${v}">${l}</button>`).join('')}</div>`;

  $('#stats').innerHTML = `
    <div class="toolbar">
      ${seg('stlevel', L, [['player','Players'],['group','Lines'],['team','Team']])}
      ${seg('stcols', UI.stCols, [['goals','By goal'],['games','By game'],['periods','By period']])}
      ${byGame || byPeriod ? `<select data-act-change="stgoal"><option value="all">Overall points</option>${S.goals.map(x => `<option value="${x.id}" ${UI.stGoal === x.id ? 'selected' : ''}>${esc(x.icon || '')} ${esc(x.name)}</option>`).join('')}</select>` : ''}
      ${!byGame ? `<select data-act-change="stgame"><option value="all">Whole season (${S.games.length} games)</option>${[...games].reverse().map(g => `<option value="${g.id}" ${UI.stGame === g.id ? 'selected' : ''}>${esc(fmtDate(g.date))} — ${esc(g.name)}</option>`).join('')}</select>` : ''}
      ${L === 'player' ? `<label class="ck"><input type="checkbox" data-act-change="share" ${UI.share ? 'checked' : ''}> Include line & team goals</label>` : ''}
    </div>
    <div class="panel">
      <p class="sub" style="margin-bottom:10px"><b style="color:var(--fg)">${byGame ? 'Whole season, game by game' : UI.stGame === 'all' ? 'Whole season' : (g => `${esc(fmtDate(g.date))} — ${esc(g.name)}`)(S.games.find(x => x.id === UI.stGame))}.</b> ${measure} Change a goal's points in the Goals tab and every game recalculates.</p>
      ${cols.length ? `<div class="mwrap"><table class="matrix">
        <tr><th class="rn"></th>${cols.map(c => `<th class="c">${esc(c.head)}<small>${esc(c.sub)}</small></th>`).join('')}<th class="c tot">Total</th>${byGame ? '<th class="c tot">Avg</th>' : ''}</tr>
        ${rows.map(r => `<tr><td class="rn">${esc(r.name)}</td>${r.cells.map(cell).join('')}<td class="c tot">${r.total}</td>${byGame ? `<td class="c tot">${r.avg.toFixed(1)}</td>` : ''}</tr>`).join('')}
      </table></div>` : `<div class="empty">${byGame ? 'No games yet' : 'No goals for this level yet'}</div>`}
    </div>
    <div class="toolbar" style="margin-top:16px">
      <button class="btn" data-act="csv">Export CSV</button>
      <button class="btn" data-act="backup">Save Backup</button>
      <button class="btn" data-act="import">Restore Backup</button>
    </div>`;
}

function joinBox(){ // shown on the Game tab until this device joins the team
  if (!TEAM_SHEET_URL || SY.url) return '';
  return `<div class="panel joinbox">
    <h2>Join your team</h2><p class="sub">Enter the team code to share games and tallies with the other coaches. You only do this once.</p>

async function post(body){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 45000);
  try {
    const r = await fetch(SY.url, { method:'POST', body:JSON.stringify(body), headers:{'Content-Type':'text/plain;charset=utf-8'}, signal:ctl.signal, redirect:'follow' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    let j; try { j = await r.json(); } catch(e){ throw new Error('Unexpected reply. Check the URL ends in /exec and access is "Anyone".'); }
    if (j.error) throw new Error(j.error);
    return j;
  } catch(e){ throw e.name === 'AbortError' ? new Error('Timed out') : e; }
  finally { clearTimeout(t); }
}
function takeResponse(res, sentCount){
  OUT = OUT.slice(sentCount);
  const remote = res.ops.some(r => r.device !== SY.device);
  if (res.ops.length){ res.ops.forEach(r => applyOp(S, r.op)); OUT.forEach(op => applyOp(S, op)); }
  SY.since = res.seq; save(); saveSync(); SYS.err = '';
  if (remote) refresh();
  return res.ops.length > 0;
}
function scheduleSync(ms){ clearTimeout(syncTimer); syncTimer = setTimeout(sync, ms ?? 2000); }
async function sync(){
  if (!SY.url || SYS.busy) return;
  if (!navigator.onLine){ SYS.err = 'No signal'; return updateSyncDot(); }
  SYS.busy = true; updateSyncDot();
  const sending = OUT.slice(0, 150);
  try {
    const res = await post({ code:SY.code, device:SY.device, coach:SY.coach, since:SY.since, ops:sending });
    if (takeResponse(res, sending.length)) scheduleTabs();
  } catch(e){ SYS.err = e.message; }
  SYS.busy = false; updateSyncDot();
  if (UI.sheet && UI.sheet.type === 'sync') renderSheet();
  if (OUT.length && !SYS.err) scheduleSync(300);
}
async function connect(url, code, coach){
  SY.url = (url || '').trim(); SY.code = (code || '').trim(); SY.coach = (coach || '').trim();
  if (!okUrl(SY.url)){ SY.url = ''; return alert('That doesn\'t look like a Google Apps Script web app URL.'); }
  if (!SY.code){ SY.url = ''; return alert('Enter the team code.'); }
  SYS.busy = true; updateSyncDot();
  try {
    const res = await post({ code:SY.code, device:SY.device, coach:SY.coach, since:0, ops:[] });
    if (res.seq === 0){
      OUT = snapshotOps(S); SY.since = 0; saveSync(); toast('Connected. Sending your data to the Sheet…');
    } else {
      const fresh = !S.games.length && !S.potg.length;
      if (!fresh && !confirm(`The team Sheet already has data. Load it onto this device?\n\nThis replaces the roster, goals and games on this device. (Save a backup first if you need what's here.)`)){ SY.url = ''; saveSync(); return; }
      S = blankState(); res.ops.forEach(r => applyOp(S, r.op)); SY.since = res.seq; OUT = []; save(); saveSync();
      ensureTrackers(); toast('You\'re on the team. Data loaded.');
    }
    SY.tabHashes = {}; saveSync();
  } catch(e){ SY.url = ''; saveSync(); alert('Could not connect: ' + e.message); }
  finally { SYS.busy = false; SYS.err = ''; updateSyncDot(); if (UI.sheet && UI.sheet.type === 'sync') ACT.close(); render(); }
  if (SY.url){ sync(); scheduleTabs(true); }
}

/* Summary tabs for the Sheet. Built here (not in the Sheet's script) so changes ship with app updates.
   Only tabs whose contents changed are sent, at most every few minutes, so slow connections aren't swamped. */
let tabsTimer = null, lastTabsAt = 0;
function scheduleTabs(soon){
  if (!SY.url) return;
  clearTimeout(tabsTimer);
  tabsTimer = setTimeout(uploadTabs, soon ? 1500 : Math.max(20000, 300000 - (Date.now() - lastTabsAt)));
}
const strHash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = (h * 33 + s.charCodeAt(i)) | 0; return String(h); };
async function uploadTabs(){
  if (!SY.url) return;
  if (SYS.busy || OUT.length || !navigator.onLine) return scheduleTabs();
  const tabs = buildTabs(), changed = {}, hashes = {};
  SY.tabHashes = SY.tabHashes || {};
  Object.keys(tabs).forEach(n => { const h = strHash(JSON.stringify(tabs[n])); if (SY.tabHashes[n] !== h){ changed[n] = tabs[n]; hashes[n] = h; } });
  if (!Object.keys(changed).length) return;
  SYS.busy = true; updateSyncDot();
  try {
    const res = await post({ code:SY.code, device:SY.device, coach:SY.coach, since:SY.since, ops:[], tabs:changed });
    Object.assign(SY.tabHashes, hashes); lastTabsAt = Date.now();
    if (takeResponse(res, 0)) scheduleTabs();
  } catch(e){ SYS.err = e.message; scheduleTabs(); }
  SYS.busy = false; updateSyncDot();
}
function buildTabs(){
  const nm = p => p ? pname(p) : '(removed)';
  const games = [...S.games].sort((a,b) => (a.date||'').localeCompare(b.date||''));
  const allEv = games.flatMap(g => g.events.map(e => ({ g, e })));
  const sum = l => l.reduce((a, x) => a + weight(x.e), 0);
  const scopeName = { individual:'Individual', group:'Line / Group', team:'Whole Team' };
  const per = p => p === 'OT' ? 'OT' : 'P' + p;
  const marks = (tid, pid) => S.potg.filter(x => (x.trackerId || 'potg') === tid && x.playerId === pid);
  const T = {};

  const tally = {};
  allEv.forEach(({ g, e }) => {
    const k = [g.id, e.period, e.goalId, e.targetType, e.targetType === 'group' ? e.targetName : e.targetId].join('|');
    if (!tally[k]){ const gl = S.goals.find(x => x.id === e.goalId);
      tally[k] = [g.id, g.date, g.name, per(e.period), gl ? gl.name : e.goalName, scopeName[gl ? gl.scope : ''] || e.targetType,
                  e.targetType === 'player' ? nm(player(e.targetId)) : e.targetName, 0, weight(e), 0]; }
    tally[k][7]++; tally[k][9] += weight(e);
  });
  T['Tally'] = [['Game ID','Date','Game','Period','Goal','Level','Who','Times','Points Each','Points'], ...Object.values(tally)];

  T['Players'] = [['Player','Games Here','Own Points','Line Points','Team Points', ...trackers().map(t => t.name)],
    ...S.players.map(p => [nm(p), games.filter(g => gPresent(g).includes(p.id)).length,
      sum(allEv.filter(x => x.e.targetType === 'player' && x.e.targetId === p.id)),
      sum(allEv.filter(x => x.e.targetType === 'group' && (x.e.members || []).includes(p.id))),
      sum(allEv.filter(x => x.e.targetType === 'team' && (x.e.members || []).includes(p.id))),
      ...trackers().map(t => marks(t.id, p.id).length)])];

  T['Trackers'] = [['Tracker','Player','Date','Game','Game ID'],
    ...[...S.potg].sort((a,b) => (a.date||'').localeCompare(b.date||'')).map(x => {
      const t = trackers().find(t => t.id === (x.trackerId || 'potg'));
      return [t ? t.name : '(deleted)', nm(player(x.playerId)), x.date || '', x.gameName || '', x.gameId || ''];
    })];

  T['Games'] = [['Game ID','Date','Game','Status','Players Here','Out','Tallies','Points', ...trackers().map(t => t.name)],
    ...games.map(g => { const here = gPresent(g);
      return [g.id, g.date, g.name, gameStatus(g), here.map(id => nm(player(id))).join(', '),
        S.players.filter(p => !here.includes(p.id)).map(nm).join(', '), g.events.length, g.events.reduce((a,e) => a + weight(e), 0),
        ...trackers().map(t => S.potg.filter(x => x.gameId === g.id && (x.trackerId || 'potg') === t.id).map(x => nm(player(x.playerId))).join(', '))]; })];

  T['Lines'] = [['Game ID','Date','Game','Line','Players','Line Points'],
    ...games.flatMap(g => gLines(g).map(l => [g.id, g.date, g.name, l.name,
      l.members.filter(m => gPresent(g).includes(m)).map(m => nm(player(m))).join(', '),
      g.events.filter(e => e.targetType === 'group' && e.targetId === l.id).reduce((a,e) => a + weight(e), 0)]))];

  T['Awards'] = [['Game ID','Date','Game','Period','Time','Level','Who','Goal','Points','Players','Coach'],
    ...allEv.map(({ g, e }) => [g.id, g.date, g.name, per(e.period), new Date(e.ts).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}),
      e.targetType, e.targetName, e.goalName, weight(e), (e.members || []).map(id => nm(player(id))).join(', '), e.coach || ''])];

  T['Goals'] = [['Goal','Icon','Who Earns It','Points Each','Times Earned','Games Used'],
    ...S.goals.map(x => [x.name, x.icon || '', scopeName[x.scope] || x.scope, Number(x.points) || 0,
      allEv.filter(a => a.e.goalId === x.id).length, games.filter(g => gGoalIds(g).includes(x.id)).length])];

  T['Roster'] = [['Number','Player','Default Lines'],
    ...S.players.map(p => [p.number || '', p.name, S.groups.filter(g => g.members.includes(p.id)).map(g => g.name).join(', ')])];
  return T;
}
function updateSyncDot(){
  const b = $('#syncbtn'); let cls, txt;
  if (!SY.url){ cls = 'off'; txt = 'Sync off'; }
  else if (SYS.busy){ cls = 'busy'; txt = 'Syncing'; }
  else if (SYS.err){ cls = 'err'; txt = OUT.length ? `${OUT.length} waiting` : 'Offline'; }
  else if (OUT.length){ cls = 'busy'; txt = `${OUT.length} waiting`; }
  else { cls = 'ok'; txt = 'Synced'; }
  b.className = cls; b.querySelector('span').textContent = txt; b.title = SYS.err || txt;
}

/* ---------------- EXPORT / IMPORT ---------------- */
async function giveFile(name, text, type){
  const blob = new Blob([text], {type});
  try {
    const file = new File([blob], name, {type});
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:name}); return; }
  } catch(e){ if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function csv(){
  const q = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  const rows = [['game_id','date','game','period','time','who_type','who','goal','points','players','coach']];
  statGames().forEach(g => g.events.forEach(e => rows.push([g.id, g.date, g.name, e.period, new Date(e.ts).toLocaleTimeString(), e.targetType, e.targetName, e.goalName, e.points,
    (e.members || []).map(id => pname(player(id))).join('; '), e.coach || ''])));
  return rows.map(r => r.map(q).join(',')).join('\n');
}

/* ---------------- ACTIONS ---------------- */
function linesOp(g, fn){ const lines = clone(gLines(g)); fn(lines); setGame(g, { lines }); renderGame(); }
function swapIds(arr, id, dir, sameAs){
  const ids = arr.map(x => x.id), i = ids.indexOf(id); let j = i + dir;
  if (sameAs) while (j >= 0 && j < arr.length && sameAs(arr[j]) !== sameAs(arr[i])) j += dir;
  if (j < 0 || j >= arr.length) return null;
  [ids[i], ids[j]] = [ids[j], ids[i]]; return ids;
}
function addPlayer(raw){
  const m = raw.match(/^#?(\d+)\s+(.+)$/);
  commit({ t:'upsert', c:'players', v:{ id: uid(), number: m ? m[1] : '', name: m ? m[2] : raw } });
}
const ACT = {
  view: d => setView(d.v),
  move: d => { const ids = swapIds(S[d.coll], d.id, +d.dir, d.coll === 'goals' ? x => x.scope : null); if (ids){ commit({ t:'order', c:d.coll, ids }); render(); } },
  del: d => {
    if (d.coll === 'trackers'){ ensureTrackers(); if (S.trackers.length <= 1) return alert('Keep at least one tracker.'); }
    const item = S[d.coll].find(x => x.id === d.id);
    if (!confirm(`Delete “${item.name}”? ${d.coll === 'trackers' ? ' Its marks will be hidden.' : ' Past awards stay in the stats.'}`)) return;
    commit({ t:'del', c:d.coll, id:d.id }); render();
  },
  member: d => { const g = clone(S.groups.find(x => x.id === d.g)); g.members = g.members.includes(d.p) ? g.members.filter(m => m !== d.p) : [...g.members, d.p]; commit({ t:'upsert', c:'groups', v:g }); render(); },
  pick: (d, b) => {
    const pk = $('#picker'); UI.pickTarget = d.target;
    pk.innerHTML = EMOJI.map(x => `<button type="button" data-act="picked" data-e="${x}">${x}</button>`).join('');
    const r = b.getBoundingClientRect();
    pk.style.left = Math.max(8, Math.min(r.left, innerWidth - 324)) + 'px';
    pk.style.top = (r.bottom + 6 + 330 > innerHeight ? Math.max(8, r.top - 336) : r.bottom + 6) + 'px';
    pk.classList.add('on');
  },
  picked: d => {
    $('#picker').classList.remove('on');
    if (UI.pickTarget === 'new'){ $('#newIcon').textContent = d.e; document.querySelector('form[data-form=goal] [name=i]').value = d.e; }
    else if (UI.pickTarget.startsWith('tr:')){ ensureTrackers(); const t = S.trackers.find(x => x.id === UI.pickTarget.slice(3)); if (t){ commit({ t:'upsert', c:'trackers', v:Object.assign(clone(t), { icon:d.e }) }); render(); } }
    else { const g = S.goals.find(x => x.id === UI.pickTarget); if (g){ commit({ t:'upsert', c:'goals', v:Object.assign(clone(g), { icon:d.e }) }); render(); } }
  },
  newscope: (d, b) => { b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); document.querySelector('form[data-form=goal] [name=s]').value = UI.newScope = d.s; },
  newpts: d => { const inp = document.querySelector('form[data-form=goal] [name=p]'); inp.value = Math.max(1, Math.min(20, (+inp.value || 0) + +d.d)); $('#newPts').textContent = inp.value; },
  bulk: () => { $('#bulk').value.split('\n').map(s => s.trim()).filter(Boolean).forEach(addPlayer); render(); },

  // games
  games: () => { openGame(null); render(); },
  opengame: d => { UI.stGame = d.id; const g = S.games.find(x => x.id === d.id); openGame(d.id, g && !g.ended && g.events.length ? 'live' : 'prep'); render(); },
  prep: () => { UI.mode = 'prep'; render(); },
  golive: () => { const g = game(); if (g.ended){ if (!confirm('Reopen this game for more awards?')) return; setGame(g, { ended:false }); } UI.mode = 'live'; render(); window.scrollTo(0, 0); },
  here: d => { const g = game(), p = new Set(gPresent(g)); p.has(d.p) ? p.delete(d.p) : p.add(d.p); setGame(g, { present:S.players.map(x => x.id).filter(id => p.has(id)) }); render(); },
  allhere: d => { setGame(game(), { present: d.v === '1' ? S.players.map(x => x.id) : [] }); render(); },
  glmember: d => linesOp(game(), ls => { const l = ls.find(x => x.id === d.g); l.members = l.members.includes(d.p) ? l.members.filter(m => m !== d.p) : [...l.members, d.p]; }),
  glmove: d => { const g = game(), ids = swapIds(gLines(g), d.id, +d.dir); if (ids) linesOp(g, ls => ls.sort((a,b) => ids.indexOf(a.id) - ids.indexOf(b.id))); },
  gldel: d => { const g = game(), l = gLines(g).find(x => x.id === d.id); if (confirm(`Remove “${l.name}” from this game?`)) linesOp(g, ls => ls.splice(ls.findIndex(x => x.id === d.id), 1)); },
  resetlines: () => { if (confirm('Replace this game\'s lines with the default lines from the Roster tab?')) { setGame(game(), { lines:clone(S.groups) }); render(); } },
  ggoal: d => { const g = game(), ids = new Set(gGoalIds(g)); ids.has(d.id) ? ids.delete(d.id) : ids.add(d.id); setGame(g, { goalIds:S.goals.map(x => x.id).filter(id => ids.has(id)) }); render(); },
  delgame: d => { const g = S.games.find(x => x.id === d.id); if (!confirm(`Delete “${g.name}” and all of its points? This can't be undone.`)) return; commit({ t:'gamedel', id:g.id }); openGame(null); render(); },
  period: d => { setGame(game(), { period:d.p }); render(); },
  endgame: () => { const g = game(); if (!confirm('End this game? You can reopen it later.')) return;
    setGame(g, { ended:true }); scheduleTabs(true); UI.potgGame = g.id; UI.tracker = 'potg'; UI.mode = 'prep'; setView('potg'); toast('Game over. Pick the Player of the Game!'); },
  close: () => { UI.sheet = null; $('#sheet').classList.remove('on'); },
  lgoal: d => { const g = S.goals.find(x => x.id === d.id); UI.sheet = { type:'pick', goalId:d.id, sel:new Set(g && g.scope === 'team' ? ['team'] : []) }; renderSheet(); },
  tog: d => { const s = UI.sheet.sel; s.has(d.id) ? s.delete(d.id) : s.add(d.id); updateApply(); },
  selline: d => { const g = game(), l = gLines(g).find(x => x.id === d.id), here = gPresent(g).filter(m => l.members.includes(m));
    const s = UI.sheet.sel, all = here.every(m => s.has(m)); here.forEach(m => all ? s.delete(m) : s.add(m)); updateApply(); },
  selclear: () => { UI.sheet.sel.clear(); updateApply(); },
  apply: () => {
    const { goalId, sel } = UI.sheet, goal = S.goals.find(x => x.id === goalId);
    const type = { individual:'player', group:'group', team:'team' }[goal.scope];
    const evs = [...sel].map(id => award(goalId, type, id));
    lastUndo = evs.map(e => ({ t:'evdel', id:e.id }));
    ACT.close(); render();
    toast(`${goal.icon || ''} ${goal.name} → ${evs.map(e => e.targetName).join(', ')}`, true);
  },
  stlevel: d => { UI.stLevel = d.v; render(); },
  stcols: d => { UI.stCols = d.v; render(); },
  undo: () => { if (!lastUndo) return; [].concat(lastUndo).forEach(op => commit(Object.assign({}, op))); lastUndo = null; $('#toast').classList.remove('on'); render(); },
  delev: d => { commit({ t:'evdel', id:d.id }); render(); },

  // POTG
  potgplus: d => {
    const sel = S.games.find(g => g.id === UI.potgGame), p = player(d.p);
    const v = { id:uid(), trackerId:UI.tracker, playerId:d.p, gameId: sel ? sel.id : '', gameName: sel ? sel.name : '', date: sel ? sel.date : today(), ts: Date.now() };
    commit({ t:'potg', v }); lastUndo = { t:'potgdel', id:v.id }; const tr = trackers().find(t => t.id === UI.tracker); toast(`${tr.icon || '✓'} ${pname(p)} — ${tr.name}`, true); render();
  },
  tracker: d => { UI.tracker = d.id; render(); },
  trsort: d => { UI.trSort = d.v; render(); },
  trnew: () => { const n = prompt('Name of the new tracker (e.g. "Wore the A", "Led the stretch")'); if (n && n.trim()){ ensureTrackers(); const id = uid(); commit({ t:'upsert', c:'trackers', v:{ id, name:n.trim(), icon:'✓' } }); UI.tracker = id; render(); } },
  potgminus: d => {
    const list = marksFor(UI.tracker).filter(x => x.playerId === d.p), pick = list.find(x => x.gameId === UI.potgGame) || list[list.length - 1];
    if (pick && confirm(`Remove ${pname(player(d.p))}'s award${pick.gameName ? ' for ' + pick.gameName : ''}?`)){ commit({ t:'potgdel', id:pick.id }); render(); }
  },

  // sync + files
  syncsettings: () => { UI.sheet = { type:'sync' }; renderSheet(); },
  syncconnect: () => connect(TEAM_SHEET_URL && !$('#syUrl') ? TEAM_SHEET_URL : ($('#syUrl').value.trim() || TEAM_SHEET_URL), $('#syCode').value, $('#syCoach').value),
  join: () => connect(TEAM_SHEET_URL, $('#joinCode').value, $('#joinName').value),
  invite: async () => {
    const link = inviteLink(), text = `Join the team in Shift Points: ${link}\n\nOpen it, then Share → Add to Home Screen. If it asks, the team code is ${SY.code}.`;
    try { if (navigator.share){ await navigator.share({ title:'Shift Points', text }); return; } } catch(e){ if (e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(text); toast('Invite copied. Paste it in a text.'); } catch(e){ prompt('Copy this invite:', text); }
  },
  syncsave: () => { SY.coach = $('#syCoach').value.trim(); SY.code = $('#syCode').value.trim(); const u = $('#syUrl'); if (u && okUrl(u.value.trim())) SY.url = u.value.trim(); saveSync(); ACT.close(); sync(); },
  syncnow: () => { SYS.err = ''; sync(); },
  syncoff: () => {
    if (OUT.length && !confirm(`${OUT.length} change(s) haven't reached the Sheet yet and won't be sent. Disconnect anyway?`)) return;
    SY.url = ''; SY.since = 0; OUT = []; saveSync(); updateSyncDot(); renderSheet();
  },
  csv: () => giveFile(`shift-points-${today()}.csv`, csv(), 'text/csv'),
  backup: () => giveFile(`shift-points-backup-${today()}.json`, JSON.stringify(S, null, 2), 'application/json'),
  import: () => $('#importFile').click(),
};

/* ---------------- EVENT WIRING ---------------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!e.target.closest('#picker') && !(b && b.dataset.act === 'pick')) $('#picker').classList.remove('on');
  if (b) { ACT[b.dataset.act](b.dataset, b); return; }
  if (e.target.id === 'sheet') ACT.close();
});
document.addEventListener('change', e => {
  const el = e.target, d = el.dataset;
  if (d.edit){
    if (d.edit.startsWith('trackers:')) ensureTrackers();
    const [coll, id, field] = d.edit.split(':'), item = S[coll].find(x => x.id === id); if (!item) return;
    const val = field === 'points' ? (Number(el.value) || 0) : el.value.trim();
    commit({ t:'upsert', c:coll, v:Object.assign(clone(item), { [field]:val }) });
    if (field === 'scope') render();
  }
  if (d.gline){ const g = game(); const lines = clone(gLines(g)); const l = lines.find(x => x.id === d.gline); if (l){ l.name = el.value.trim(); setGame(g, { lines }); } }
  if (d.gfield){ setGame(game(), { [d.gfield]: el.value.trim() }); }
  if (d.actChange === 'stgame'){ UI.stGame = el.value; renderStats(); }
  if (d.actChange === 'stgoal'){ UI.stGoal = el.value; renderStats(); }
  if (d.actChange === 'share'){ UI.share = el.checked; renderStats(); }
  if (d.actChange === 'potggame'){ UI.potgGame = el.value; renderPotg(); }
});
document.addEventListener('focusout', () => setTimeout(() => {
  const a = document.activeElement;
  if (pendingRender && !(a && a.matches('input,textarea,select'))) render();
}, 0));
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && (e.target.dataset.edit || e.target.dataset.gline || e.target.dataset.gfield)) e.target.blur();
  if (e.key === 'Escape' && UI.sheet) ACT.close();
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, kind = f.dataset.form, v = n => (f.elements[n]?.value || '').trim();
  if (kind === 'player' && v('n')) addPlayer(v('n'));
  else if (kind === 'group' && v('n')) commit({ t:'upsert', c:'groups', v:{ id: uid(), name: v('n'), members: [] } });
  else if (kind === 'goal' && v('n')) commit({ t:'upsert', c:'goals', v:{ id: uid(), name: v('n'), scope: v('s'), points: Number(v('p')) || 1, icon: v('i') || '⭐' } });
  else if (kind === 'gline' && v('n')) { const n = v('n'); linesOp(game(), ls => ls.push({ id: uid(), name: n, members: [] })); }
  else if (kind === 'newgame'){
    const prev = [...S.games].sort((a,b) => (a.date||'').localeCompare(b.date||'')).pop();
    const id = uid();
    commit({ t:'game', v:{ id, name: v('o') || 'Game', date: v('d') || today(), period:'1', ended:false,
      present: S.players.map(p => p.id), lines: clone(prev ? gLines(prev) : S.groups), goalIds: prev ? gGoalIds(prev).slice() : S.goals.map(x => x.id) } });
    openGame(id, 'prep'); UI.stGame = id; render(); return;
  } else return;
  render();
  const nf = document.querySelector(`form[data-form="${kind}"] input[name="n"]`); if (nf) nf.focus();
});
$('#importFile').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try { const d = JSON.parse(r.result); if (!d.players || !d.goals) throw new Error('Not a Shift Points backup');
      if (!confirm('Replace everything on this device with this backup?' + (SY.url ? ' It will also be sent to the team Sheet.' : ''))) return;
      S = Object.assign(blankState(), d); save();
      if (SY.url){ OUT.push(...snapshotOps(S)); saveSync(); sync(); }
      UI.stGame = 'all'; render(); toast('Backup restored');
    } catch(err){ alert('Could not read file: ' + err.message); }
    e.target.value = '';
  };
  r.readAsText(file);
});

setInterval(() => sync(), 30000);
setTimeout(() => scheduleTabs(), 5000); // also pushes new tab layouts after an app update
addEventListener('online', () => { SYS.err = ''; sync(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
ensureTrackers();
// Invite links: ...#join=TEAMCODE connects this device right away.
(() => { const m = location.hash.match(/join=([^&]+)/); if (!m) return;
  history.replaceState(null, '', location.pathname + location.search);
  if (TEAM_SHEET_URL && !SY.url) setTimeout(() => connect(TEAM_SHEET_URL, decodeURIComponent(m[1]), ''), 300); })();
updateSyncDot();
setView(UI.view);
sync();
</script>
